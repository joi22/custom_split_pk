# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "f8a6f0327327a0a8a88f93907e2e26d8"
name = "startstorez-announcement-bar"
application_url = "https://gear-specialist-southwest-bikini.trycloudflare.com"
embedded = true

[build]
automatically_update_urls_on_dev = true
include_config_on_deploy = true

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_products,write_metaobjects,write_metaobject_definitions"

[auth]
redirect_urls = [ "https://gear-specialist-southwest-bikini.trycloudflare.com/api/auth" ]

[app_proxy]
url = "https://gear-specialist-southwest-bikini.trycloudflare.com/apps/qistbazaar"
subpath = "qistbazaar"
prefix = "apps"

[product.metafields.app.demo_info]
type = "single_line_text_field"
name = "Demo Source Info"
description = "Tracks products created by the Shopify app template for development"

  [product.metafields.app.demo_info.access]
  admin = "merchant_read_write"

[product.metafields.qistbazaar.enabled]
type = "boolean"
name = "QistBazaar Enabled"
description = "Enable QistBazaar installments widget for this product"

  [product.metafields.qistbazaar.enabled.access]
  admin = "merchant_read_write"

[product.metafields.qistbazaar.item_code]
type = "single_line_text_field"
name = "QistBazaar Item Code"
description = "QistBazaar item code (usually the product SKU)"

  [product.metafields.qistbazaar.item_code.access]
  admin = "merchant_read_write"

[metaobjects.app.example]
name = "Example"
description = "An example metaobject definition created by this template"

  [metaobjects.app.example.access]
  admin = "merchant_read_write"

[metaobjects.app.example.fields.title]
name = "Title"
type = "single_line_text_field"
required = true

[metaobjects.app.example.fields.description]
name = "Description"
type = "multi_line_text_field"
